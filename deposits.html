<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legacy Wealth | Member Portal</title><link rel="stylesheet" href="styles.css"><style>

ta.user.email.split('@')[0];return{u:data.user,p:p||{}}},money(n,c='USD'){return new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(Number(n)||0)},esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}};document.getElementById('logout')?.addEventListener('click',async()=>{await db.auth.signOut();location.href='index.html'})})();</script><script>(async()=>{const a=await LW.auth();if(!a)return;const{data:ac}=await LW.db.from('receiving_accounts').select('*').eq('active',true).order('created_at',{ascending:false});recv.innerHTML=(ac||[]).map(x=>'<div class="card"><b>'+x.method.toUpperCase()+' • '+x.currency+'</b><p class="muted">'+(x.bank_name?'<b>Bank:</b> '+LW.esc(x.bank_name)+'<br><b>Account:</b> '+LW.esc(x.account_name)+'<br><b>Number:</b> '+LW.esc(x.account_number):'')+(x.wallet_address?'<b>Wallet:</b> '+LW.esc(x.wallet_address)+'<br><b>Crypto:</b> '+LW.esc(x.crypto||'')+'<br><b>Network:</b> '+LW.esc(x.network||''):'')+'</p></div>').join('')||'No receiving accounts configured.';depositForm.onsubmit=async e=>{e.preventDefault();const account=(ac||[]).find(x=>x.method===depMethod.value&&x.currency===depCurrency.value);if(!account){depMsg.textContent='No active receiving account matches this method and currency.';return}const snap={id:account.id,method:account.method,currency:account.currency,bank_name:account.bank_name,account_name:account.account_name,account_number:account.account_number,wallet_address:account.wallet_address,crypto:account.crypto,network:account.network};const q=await LW.db.from('deposits').insert({user_id:a.u.id,amount:Number(depAmount.value),currency:depCurrency.value,method:depMethod.value,receiving_account_snapshot:snap,reference:depRef.value,proof_url:depProof.value||null});depMsg.textContent=q.error?.message||'Deposit submitted and is pending review.';if(!q.error)e.target.reset()};const{data:ds}=await LW.db.from('deposits').select('*').eq('user_id',a.u.id).order('created_at',{ascending:false});myDeposits.innerHTML=(ds||[]).map(x=>'<div class="card"><b>'+LW.money(x.amount,x.currency)+'</b> • '+LW.esc(x.method)+' • '+LW.esc(x.status)+'<br><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div>').join('')||'No deposits yet.'})();</script></body></html>
