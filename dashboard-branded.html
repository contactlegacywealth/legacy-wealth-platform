<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Legacy Wealth | Member Portal</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a08}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.brand-cover{position:fixed;top:0;left:0;height:76px;width:250px;z-index:10;background:#0d0f0d;display:flex;align-items:center;padding:0 12px;box-sizing:border-box}.brand-cover img{width:185px;height:68px;object-fit:contain;display:block}@media(max-width:800px){.brand-cover{left:56px;width:210px;padding:0 4px}.brand-cover img{width:195px;height:68px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="member-role-guard.js?v=20260926"></script></head><body><iframe id="memberPortal" src="dashboard.html?v=20260926" title="Legacy Wealth Member Portal"></iframe><div class="brand-cover"><img src="assets/legacy-wealth-logo.jpg" alt="Legacy Wealth"></div><script>(function(){const frame=document.getElementById('memberPortal');function syncKyc(){try{const d=frame.contentDocument||frame.contentWindow.document;if(!d)return;const form=d.getElementById('kf'),status=d.getElementById('ks');if(!form||!status)return;const text=(status.textContent||'').toLowerCase();const locked=text.includes('pending review')||text.includes('under review')||text.includes('approved');if(locked){form.style.display='none';form.setAttribute('aria-hidden','true');let box=d.getElementById('kycLockedNotice');if(!box){box=d.createElement('div');box.id='kycLockedNotice';box.className='card';box.style.cssText='margin-top:14px;border:1px solid #2f6144;background:#0d1710;color:#d8eadc;border-radius:14px;padding:18px';box.innerHTML='<h3 style="margin:0 0 8px">KYC status updated</h3><p style="margin:0;color:#9fb3a5">Your KYC submission is already under review or approved. You do not need to submit the form again.</p>';form.parentNode.appendChild(box)}}else{form.style.display='';form.removeAttribute('aria-hidden');const box=d.getElementById('kycLockedNotice');if(box)box.remove()}}catch(e){console.debug('KYC UI sync:',e)}}frame.addEventListener('load',function(){syncKyc();try{const d=frame.contentDocument||frame.contentWindow.document;const target=d.getElementById('ks');if(target)new MutationObserver(syncKyc).observe(target,{childList:true,subtree:true,characterData:true})}catch(e){}});setInterval(syncKyc,1000)})();</script></body></html>
