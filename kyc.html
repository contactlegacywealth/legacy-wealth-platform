<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Legacy Wealth | KYC Verification</title><link rel="stylesheet" href="styles.css"></head><body><header class="mh"><div><a class="brand2" href="index.html"><i>LW</i>LEGACY <b>WEALTH</b></a></div><div><a class="btn ghost" href="index.html">Home</a><button class="btn gold" id="logout">Log out</button></div></header><main class="main"><div class="eyebrow">MEMBER PORTAL</div><h1>KYC Verification</h1><p class="muted">Welcome, <span id="name">Member</span>.</p><div class="card"><h2>Identity verification</h2><div id="statusBox" class="card" style="display:none"></div><div id="formWrap"><p class="muted">Enter your NIN exactly as issued and upload clear NIN front, NIN back and selfie images. Your documents are private and reviewed by authorized administrators.</p><form id="kf"><label>Legal name<input id="ln" required></label><label>Date of birth<input id="dob" type="date" required></label><label>Nationality<input id="nat" value="Nigeria" required></label><label>Residential address<input id="addr" required></label><label>NIN — exactly 11 digits<input id="nin" inputmode="numeric" maxlength="11" minlength="11" pattern="[0-9]{11}" required></label><label>NIN front<input id="front" type="file" accept="image/jpeg,image/png,image/webp" required></label><p id="frontStatus"></p><label>NIN back<input id="back" type="file" accept="image/jpeg,image/png,image/webp" required></label><p id="backStatus"></p><label>Selfie — your own face<input id="selfie" type="file" accept="image/jpeg,image/png,image/webp" capture="user" required></label><p id="selfieStatus"></p><button class="btn gold" id="submit" type="submit">Submit KYC for review</button><p id="state"></p></form></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="member-role-guard.js?v=20260926"></script><script>(async()=>{const db=window.supabase.createClient('https://ftugvecpcqjtvoiktjly.supabase.co','sb_publishable_-0pRAIJEppMpN2wlsjXfJg_Hg5CuieZ');const $=id=>document.getElementById(id),state=$('state'),button=$('submit');$('logout').onclick=async()=>{await db.auth.signOut();location.href='index.html'};try{const{data:{user}}=await db.auth.getUser();if(!user){location.href='index.html';return}const{data:admin}=await db.from('admin_users').select('user_id').eq('user_id',user.id).eq('active',true).maybeSingle();if(admin){location.replace('admin-branded.html');return}const{data:p,error:pe}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(pe)throw pe;$('name').textContent=p?.full_name||user.email.split('@')[0];$('ln').value=p?.full_name||'';$('nat').value=p?.country||'Nigeria';const{data:k,error:ke}=await db.from('kyc_applications').select('*').eq('user_id',user.id).maybeSingle();if(ke)throw ke;if(k){$('ln').value=k.legal_name||$('ln').value;$('dob').value=k.date_of_birth||'';$('nat').value=k.nationality||$('nat').value;$('addr').value=k.address||'';$('nin').value=(k.nin_number||k.id_number||'').replace(/\D/g,'').slice(0,11);if(k.status==='pending_review'||k.status==='approved'){const box=$('statusBox');box.style.display='block';box.innerHTML=k.status==='approved'?'<h3>KYC Approved Successfully ✓</h3><p>Your identity verification has been approved.</p>':'<h3>KYC Under Review</h3><p>Your KYC has been submitted successfully. Please wait while our authorized team reviews it.</p>';$('formWrap').style.display='none'}}$('nin').oninput=()=>{$('nin').value=$('nin').value.replace(/\D/g,'').slice(0,11)};['front','back','selfie'].forEach(id=>$(id).onchange=e=>$(id+'Status').textContent=e.target.files[0]?e.target.files[0].name:'');function check(f,label){if(!f)throw Error(label+' is required.');if(f.size>10*1024*1024)throw Error(label+' is larger than 10 MB. Please choose a smaller photo.');if(!['image/jpeg','image/png','image/webp'].includes((f.type||'').toLowerCase()))throw Error(label+' must be JPG, PNG or WEBP.')}$('kf').onsubmit=async e=>{e.preventDefault();const files=[$('front').files[0],$('back').files[0],$('selfie').files[0]],labels=['NIN front','NIN back','Selfie'];let paths=[];try{files.forEach((f,i)=>check(f,labels[i]));button.disabled=true;state.style.display='block';for(let i=0;i<3;i++){state.textContent='Uploading '+labels[i]+'…';const ext=(files[i].name.split('.').pop()||'jpg').toLowerCase();const path=user.id+'/'+['nin-front','nin-back','selfie'][i]+'-'+Date.now()+'-'+i+'.'+ext;const up=await db.storage.from('kyc-documents').upload(path,files[i],{upsert:false,contentType:files[i].type,cacheControl:'3600'});if(up.error)throw Error(labels[i]+' upload failed: '+up.error.message);paths.push(path)}state.textContent='Submitting KYC for review…';const save=await db.rpc('submit_member_kyc',{p_legal_name:$('ln').value.trim(),p_date_of_birth:$('dob').value,p_nationality:$('nat').value.trim(),p_address:$('addr').value.trim(),p_nin:$('nin').value.trim(),p_nin_front_path:paths[0],p_nin_back_path:paths[1],p_selfie_path:paths[2]});if(save.error)throw Error(save.error.message||'KYC could not be saved.');state.textContent='KYC submitted successfully and is now under review.';setTimeout(()=>location.reload(),700)}catch(err){state.textContent=err.message||'KYC submission failed. Please try again.';if(paths.length)try{await db.storage.from('kyc-documents').remove(paths)}catch(_){}}finally{button.disabled=false}}}catch(err){state.textContent=err.message||'KYC page could not be loaded. Please refresh and try again.'}})();</script></body></html>
